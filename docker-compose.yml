services:
  postgres:
    image: postgres:17
    container_name: tripwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tripwise
      POSTGRES_USER: tripwise
      POSTGRES_PASSWORD: tripwise_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: